<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PSoC6 AHRS WebSerial Visualizer</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 16px; background: #111; color: #eee; }
    .row { display: flex; gap: 16px; flex-wrap: wrap; }
    .card { background: #1b1b1b; border: 1px solid #333; border-radius: 8px; padding: 12px; }
    #telemetry { min-width: 320px; }
    #cubeWrap {
      width: 220px; height: 220px; padding: 0; overflow: hidden; position: relative;
      background: radial-gradient(circle at top, #18345c 0%, #08111f 65%, #02060b 100%);
    }
    #modelCanvas { display: block; width: 100%; height: 100%; }
    #viewerStatus {
      position: absolute; inset: auto 0 10px 0; text-align: center;
      color: #9ad; font-size: 12px; pointer-events: none;
    }
    #compass {
      width: 160px; height: 160px; border: 2px solid #555; border-radius: 50%;
      position: relative; margin: 8px auto;
    }
    #needle {
      width: 2px; height: 70px; background: #f55;
      position: absolute; left: 79px; top: 10px;
      transform-origin: 50% 100%;
    }
    #altGraph { background: #000; border: 1px solid #444; }
    pre { margin: 0; white-space: pre-wrap; }
    button { margin-right: 6px; }
  </style>
</head>
<body>
  <h2>PSoC6 Drone AHRS Visualizer (WebSerial)</h2>
  <div class="card">
    <button id="connectBtn">Connect</button>
    <button id="disconnectBtn" disabled>Disconnect</button>
    <button id="idleBtn" aria-pressed="false">Enable Idle</button>
    <span id="status" role="status" aria-live="polite">Disconnected</span>
    <span id="deviceStatus" style="margin-left:12px;color:#9ad;">Device: waiting</span>
  </div>

  <div class="row" style="margin-top:12px;">
    <div class="card" id="cubeWrap">
      <canvas id="modelCanvas" aria-label="3D drone attitude visualizer"></canvas>
      <div id="viewerStatus">Loading 3D model…</div>
    </div>

    <div class="card" style="min-width:190px;">
      <h4 style="margin:4px 0">Compass</h4>
      <div id="compass"><div id="needle"></div></div>
      <div>Heading: <span id="heading">0.0</span>°</div>
    </div>

    <div class="card">
      <h4 style="margin:4px 0">Altitude</h4>
      <canvas id="altGraph" width="360" height="160"></canvas>
      <div>Current: <span id="altitude">0.00</span> m</div>
    </div>

    <div class="card" id="telemetry">
      <h4 style="margin:4px 0">Telemetry</h4>
      <pre id="telemetryText">Waiting for data...</pre>
    </div>
  </div>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/build/three.module.js",
    "three/addons/": "./vendor/three/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

let port, reader, writer, keepReading = false, idleState = false;
let decoder, pipeAbortController, pipePromise;
const statusEl = document.getElementById('status');
const deviceStatusEl = document.getElementById('deviceStatus');
const modelCanvas = document.getElementById('modelCanvas');
const viewerStatusEl = document.getElementById('viewerStatus');
const needle = document.getElementById('needle');
const headingEl = document.getElementById('heading');
const altitudeEl = document.getElementById('altitude');
const telemetryText = document.getElementById('telemetryText');
const idleBtn = document.getElementById('idleBtn');
const canvas = document.getElementById('altGraph');
const ctx = canvas.getContext('2d');
const altHistory = [];
let parseErrors = 0;
const clock = new THREE.Clock();
const deviceToSceneQuaternion = new THREE.Quaternion().setFromEuler(new THREE.Euler(-Math.PI / 2, 0, 0));
const deviceToSceneInverse = deviceToSceneQuaternion.clone().invert();
const targetModelQuaternion = new THREE.Quaternion();
const droneRoot = new THREE.Group();
let scene, camera, renderer;
let animationMixer;
targetModelQuaternion.identity();

function initViewer() {
  try {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
    renderer = new THREE.WebGLRenderer({ canvas: modelCanvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

    scene.add(droneRoot);
    scene.add(new THREE.HemisphereLight(0xaad8ff, 0x101820, 2.4));
    const keyLight = new THREE.DirectionalLight(0xffffff, 1.8);
    keyLight.position.set(2, 3, 4);
    scene.add(keyLight);
    camera.position.set(0.55, 0.35, 1.35);
    camera.lookAt(0, 0.12, 0);

    const loader = new GLTFLoader();
    loader.load(
      './animated_drone.glb',
      (gltf) => {
        const model = gltf.scene;
        const bounds = new THREE.Box3().setFromObject(model);
        const center = bounds.getCenter(new THREE.Vector3());
        const size = bounds.getSize(new THREE.Vector3());
        const maxDimension = Math.max(size.x, size.y, size.z) || 1;

        model.position.sub(center);
        model.scale.setScalar(0.9 / maxDimension);
        droneRoot.add(model);

        if (gltf.animations.length) {
          animationMixer = new THREE.AnimationMixer(model);
          for (const clip of gltf.animations) {
            animationMixer.clipAction(clip).play();
          }
        }

        setViewerStatus('');
      },
      undefined,
      (error) => {
        console.error('Failed to load 3D model', error);
        setViewerStatus('3D model failed to load');
      }
    );
  } catch (error) {
    console.error('Failed to initialize 3D viewer', error);
    setViewerStatus('3D viewer unavailable');
  }
}

function resizeViewer() {
  if (!renderer || !camera) return;
  const parent = modelCanvas.parentElement;
  const width = modelCanvas.clientWidth || parent?.clientWidth || 0;
  const height = modelCanvas.clientHeight || parent?.clientHeight || 0;
  if (!width || !height) return;
  renderer.setSize(width, height, false);
  camera.aspect = width / height;
  camera.updateProjectionMatrix();
}

function setViewerStatus(text = '') {
  viewerStatusEl.textContent = text;
  viewerStatusEl.style.display = text ? 'block' : 'none';
}

function setAttitudeFromEulerDegrees(rollDeg, pitchDeg, yawDeg) {
  if (![rollDeg, pitchDeg, yawDeg].every(Number.isFinite)) return false;
  const yawQuaternion = new THREE.Quaternion().setFromAxisAngle(
    new THREE.Vector3(0, 0, 1),
    THREE.MathUtils.degToRad(yawDeg)
  );
  const pitchQuaternion = new THREE.Quaternion().setFromAxisAngle(
    new THREE.Vector3(1, 0, 0),
    THREE.MathUtils.degToRad(pitchDeg)
  );
  const rollQuaternion = new THREE.Quaternion().setFromAxisAngle(
    new THREE.Vector3(0, 1, 0),
    THREE.MathUtils.degToRad(rollDeg)
  );
  // Preserve the original CSS fallback order: rotateZ(yaw) rotateX(pitch) rotateY(roll).
  const deviceQuaternion = yawQuaternion.multiply(pitchQuaternion).multiply(rollQuaternion);
  targetModelQuaternion.copy(deviceToSceneQuaternion).multiply(deviceQuaternion).multiply(deviceToSceneInverse);
  return true;
}

function setAttitudeFromPacket(data) {
  const q = data.quaternion;
  if (q && [q.w, q.x, q.y, q.z].every(Number.isFinite)) {
    // Firmware quaternion uses aircraft/body axes; rotate that frame into the scene's Y-up view basis.
    const deviceQuaternion = new THREE.Quaternion(q.x, q.y, q.z, q.w).normalize();
    targetModelQuaternion.copy(deviceToSceneQuaternion).multiply(deviceQuaternion).multiply(deviceToSceneInverse);
    return true;
  }
  return setAttitudeFromEulerDegrees(data.roll, data.pitch, data.yaw);
}

function animate() {
  requestAnimationFrame(animate);
  resizeViewer();
  const deltaSeconds = Math.min(clock.getDelta(), 0.25);
  if (animationMixer) {
    animationMixer.update(deltaSeconds);
  }
  const smoothing = 1 - Math.exp(-12 * deltaSeconds);
  droneRoot.quaternion.slerp(targetModelQuaternion, smoothing);
  if (renderer && scene && camera) {
    renderer.render(scene, camera);
  }
}

window.addEventListener('resize', resizeViewer);
initViewer();
resizeViewer();
animate();

function setIdleUi(isIdle) {
  idleState = isIdle;
  idleBtn.textContent = idleState ? 'Disable Idle' : 'Enable Idle';
  idleBtn.setAttribute('aria-pressed', idleState ? 'true' : 'false');
}

function resetSessionUi() {
  setIdleUi(false);
  parseErrors = 0;
  altHistory.length = 0;
  drawAltitudeGraph();
  headingEl.textContent = '0.0';
  altitudeEl.textContent = '0.00';
  targetModelQuaternion.identity();
  droneRoot.quaternion.identity();
  telemetryText.textContent = 'Waiting for data...';
  deviceStatusEl.textContent = 'Device: disconnected';
}

function drawAltitudeGraph() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (altHistory.length < 2) return;

  const minAlt = Math.min(...altHistory);
  const maxAlt = Math.max(...altHistory);
  const range = Math.max(0.5, maxAlt - minAlt);

  ctx.strokeStyle = '#4af';
  ctx.beginPath();
  for (let i = 0; i < altHistory.length; i++) {
    const x = (i / (altHistory.length - 1)) * canvas.width;
    const y = canvas.height - ((altHistory[i] - minAlt) / range) * canvas.height;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();
}

function updateUI(packet) {
  telemetryText.textContent = JSON.stringify(packet, null, 2);

  if (packet.type === 'ahrs') {
    const d = packet.data;
    setAttitudeFromPacket(d);
    needle.style.transform = `rotate(${d.heading}deg)`;
    headingEl.textContent = Number(d.heading).toFixed(1);
  }

  if (packet.type === 'sensor') {
    const d = packet.data;
    const altitude = Number(d.baro.altitudeM);
    if (Number.isFinite(altitude)) {
      altitudeEl.textContent = altitude.toFixed(2);
      altHistory.push(altitude);
      if (altHistory.length > 240) altHistory.shift();
      drawAltitudeGraph();
    }

  }

  if (packet.type === 'status') {
    deviceStatusEl.textContent = `Device: ${packet.data.level}: ${packet.data.message}`;
    if (typeof packet.data.lowPowerIdle === 'boolean') {
      setIdleUi(packet.data.lowPowerIdle);
    }
  }
}

async function connect() {
  if (!('serial' in navigator)) {
    alert('WebSerial is not supported in this browser.');
    return;
  }

  try {
    port = await navigator.serial.requestPort();
    await port.open({ baudRate: 115200 });
    writer = port.writable.getWriter();
    decoder = new TextDecoderStream();
    pipeAbortController = new AbortController();
    pipePromise = port.readable
      .pipeTo(decoder.writable, { signal: pipeAbortController.signal })
      .catch(() => {});
    reader = decoder.readable.getReader();
    keepReading = true;
    statusEl.textContent = 'Connected';
    document.getElementById('connectBtn').disabled = true;
    document.getElementById('disconnectBtn').disabled = false;
  } catch (error) {
    keepReading = false;
    try { if (reader) reader.releaseLock(); } catch (_) {}
    try { if (writer) writer.releaseLock(); } catch (_) {}
    try { if (port) await port.close(); } catch (_) {}
    reader = undefined;
    writer = undefined;
    port = undefined;
    resetSessionUi();
    decoder = undefined;
    pipeAbortController = undefined;
    pipePromise = undefined;
    throw error;
  }

  let buffer = '';
  try {
    while (keepReading) {
      const { value, done } = await reader.read();
      if (done) break;
      if (!value) break;
      buffer += value;

      let nl;
      while ((nl = buffer.indexOf('\n')) >= 0) {
        const line = buffer.slice(0, nl).trim();
        buffer = buffer.slice(nl + 1);
        if (!line) continue;
        try {
          const packet = JSON.parse(line);
          updateUI(packet);
        } catch (_) {
          parseErrors += 1;
          deviceStatusEl.textContent = `Device: telemetry parse errors=${parseErrors}`;
        }
      }
    }
  } finally {
    if (port) {
      await disconnect(true);
    }
  }
}

async function disconnect(skipPipeAwait = false) {
  keepReading = false;
  try { if (reader) await reader.cancel(); } catch (_) {}
  try { if (reader) reader.releaseLock(); } catch (_) {}
  try { if (pipeAbortController) pipeAbortController.abort(); } catch (_) {}
  if (!skipPipeAwait) {
    try { if (pipePromise) await pipePromise; } catch (_) {}
  }
  try { if (writer) writer.releaseLock(); } catch (_) {}
  try { if (port) await port.close(); } catch (_) {}
  reader = undefined;
  writer = undefined;
  port = undefined;
  decoder = undefined;
  pipeAbortController = undefined;
  pipePromise = undefined;
  statusEl.textContent = 'Disconnected';
  resetSessionUi();
  document.getElementById('connectBtn').disabled = false;
  document.getElementById('disconnectBtn').disabled = true;
}

async function toggleIdle() {
  if (!writer) return;
  const cmd = idleState ? 'IDLE:0\n' : 'IDLE:1\n';
  await writer.write(new TextEncoder().encode(cmd));
}

document.getElementById('connectBtn').addEventListener('click', () => connect().catch(err => {
  statusEl.textContent = `Connect error: ${err.message}`;
  resetSessionUi();
}));
document.getElementById('disconnectBtn').addEventListener('click', () => disconnect().catch(err => {
  statusEl.textContent = `Disconnect error: ${err.message}`;
}));
idleBtn.addEventListener('click', () => toggleIdle().catch(err => {
  statusEl.textContent = `Idle command error: ${err.message}`;
}));
resetSessionUi();
</script>
</body>
</html>
