<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PSoC6 AHRS WebSerial Visualizer</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 16px; background: #111; color: #eee; }
    .row { display: flex; gap: 16px; flex-wrap: wrap; }
    .card { background: #1b1b1b; border: 1px solid #333; border-radius: 8px; padding: 12px; }
    #telemetry { min-width: 320px; }
    #attitudeWrap { min-width: 244px; }
    #attitudeScene {
      perspective: 700px;
      width: 220px;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
    }
    #drone {
      position: relative;
      width: 180px;
      height: 180px;
      transform-style: preserve-3d;
    }
    .drone-part {
      position: absolute;
      left: 50%;
      top: 50%;
      transform-style: preserve-3d;
    }
    .body {
      width: 60px;
      height: 34px;
      margin-left: -30px;
      margin-top: -17px;
      border-radius: 16px;
      background: linear-gradient(135deg, #6fb3ff, #245cff);
      border: 1px solid rgba(200, 225, 255, 0.65);
      box-shadow: 0 0 16px rgba(50, 130, 255, 0.35);
    }
    .body-lower {
      background: rgba(30, 66, 180, 0.95);
      transform: translateZ(-10px);
      box-shadow: none;
    }
    .nose {
      width: 18px;
      height: 18px;
      margin-left: 18px;
      margin-top: -9px;
      border-radius: 50%;
      background: #ff9555;
      border: 1px solid rgba(255, 220, 200, 0.85);
      transform: translateZ(12px);
      box-shadow: 0 0 12px rgba(255, 149, 85, 0.45);
    }
    .arm {
      width: 116px;
      height: 8px;
      margin-left: -58px;
      margin-top: -4px;
      border-radius: 999px;
      background: linear-gradient(90deg, #85b7ff, #6c9cff, #85b7ff);
      box-shadow: 0 0 12px rgba(80, 140, 255, 0.25);
    }
    .arm-a { transform: rotate(45deg); }
    .arm-b { transform: rotate(-45deg); }
    .motor {
      width: 22px;
      height: 22px;
      margin-left: -11px;
      margin-top: -11px;
      border-radius: 50%;
      background: rgba(117, 166, 255, 0.95);
      border: 2px solid rgba(220, 235, 255, 0.75);
      transform: translateZ(10px);
      box-shadow: 0 0 14px rgba(117, 166, 255, 0.25);
    }
    .motor::before, .motor::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 50%;
      width: 34px;
      height: 4px;
      margin-left: -17px;
      margin-top: -2px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
    }
    .motor::after {
      transform: rotate(90deg);
    }
    .m1 { margin-left: -53px; margin-top: -53px; }
    .m2 { margin-left: 31px; margin-top: -53px; }
    .m3 { margin-left: -53px; margin-top: 31px; }
    .m4 { margin-left: 31px; margin-top: 31px; }
    #attitudeState {
      margin-top: 8px;
      color: #9ad;
      font-size: 0.9rem;
      text-align: center;
    }
    #attitudeAxes {
      margin-top: 4px;
      color: #7f8da6;
      font-size: 0.82rem;
      text-align: center;
    }
    #compass {
      width: 160px; height: 160px; border: 2px solid #555; border-radius: 50%;
      position: relative; margin: 8px auto;
    }
    #needle {
      width: 2px; height: 70px; background: #f55;
      position: absolute; left: 79px; top: 10px;
      transform-origin: 50% 100%;
    }
    #altGraph { background: #000; border: 1px solid #444; }
    pre { margin: 0; white-space: pre-wrap; }
    button { margin-right: 6px; }
  </style>
</head>
<body>
  <h2>PSoC6 Drone AHRS Visualizer (WebSerial)</h2>
  <div class="card">
    <button id="connectBtn">Connect</button>
    <button id="disconnectBtn" disabled>Disconnect</button>
    <button id="idleBtn" aria-pressed="false">Enable Idle</button>
    <span id="status" role="status" aria-live="polite">Disconnected</span>
    <span id="deviceStatus" style="margin-left:12px;color:#9ad;">Device: waiting</span>
  </div>

  <div class="row" style="margin-top:12px;">
    <div class="card" id="attitudeWrap">
      <h4 style="margin:4px 0">Drone Attitude</h4>
      <div id="attitudeScene">
        <div id="drone" role="img" aria-label="3D drone attitude model">
          <div class="drone-part arm arm-a"></div>
          <div class="drone-part arm arm-b"></div>
          <div class="drone-part body"></div>
          <div class="drone-part body body-lower"></div>
          <div class="drone-part nose"></div>
          <div class="drone-part motor m1"></div>
          <div class="drone-part motor m2"></div>
          <div class="drone-part motor m3"></div>
          <div class="drone-part motor m4"></div>
        </div>
      </div>
      <div id="attitudeState" role="status" aria-live="polite">Awaiting first AHRS packet (neutral attitude)</div>
      <div id="attitudeAxes">AHRS axes: roll about X, pitch about Y, yaw about Z</div>
    </div>

    <div class="card" style="min-width:190px;">
      <h4 style="margin:4px 0">Compass</h4>
      <div id="compass"><div id="needle"></div></div>
      <div>Heading: <span id="heading">0.0</span>°</div>
    </div>

    <div class="card">
      <h4 style="margin:4px 0">Altitude</h4>
      <canvas id="altGraph" width="360" height="160"></canvas>
      <div>Current: <span id="altitude">0.00</span> m</div>
    </div>

    <div class="card" id="telemetry">
      <h4 style="margin:4px 0">Telemetry</h4>
      <pre id="telemetryText">Waiting for data...</pre>
    </div>
  </div>

<script>
let port, reader, writer, keepReading = false, idleState = false;
let decoder, pipeAbortController, pipePromise;
const statusEl = document.getElementById('status');
const deviceStatusEl = document.getElementById('deviceStatus');
const drone = document.getElementById('drone');
const needle = document.getElementById('needle');
const headingEl = document.getElementById('heading');
const altitudeEl = document.getElementById('altitude');
const telemetryText = document.getElementById('telemetryText');
const attitudeStateEl = document.getElementById('attitudeState');
const idleBtn = document.getElementById('idleBtn');
const canvas = document.getElementById('altGraph');
const ctx = canvas.getContext('2d');
const altHistory = [];
let parseErrors = 0;
let hasAhrsPacket = false;
let droneAnimationFrame = 0;
const renderedOrientation = { w: 1, x: 0, y: 0, z: 0 };
const targetOrientation = { w: 1, x: 0, y: 0, z: 0 };

function setIdleUi(isIdle) {
  idleState = isIdle;
  idleBtn.textContent = idleState ? 'Disable Idle' : 'Enable Idle';
  idleBtn.setAttribute('aria-pressed', idleState ? 'true' : 'false');
}

function resetSessionUi() {
  setIdleUi(false);
  parseErrors = 0;
  altHistory.length = 0;
  drawAltitudeGraph();
  if (droneAnimationFrame) {
    cancelAnimationFrame(droneAnimationFrame);
    droneAnimationFrame = 0;
  }
  hasAhrsPacket = false;
  setQuaternion(renderedOrientation, { w: 1, x: 0, y: 0, z: 0 });
  setQuaternion(targetOrientation, { w: 1, x: 0, y: 0, z: 0 });
  updateDroneTransform();
  headingEl.textContent = '0.0';
  altitudeEl.textContent = '0.00';
  telemetryText.textContent = 'Waiting for data...';
  attitudeStateEl.textContent = 'Awaiting first AHRS packet (neutral attitude)';
  deviceStatusEl.textContent = 'Device: disconnected';
}

function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}

function setQuaternion(target, source) {
  target.w = source.w;
  target.x = source.x;
  target.y = source.y;
  target.z = source.z;
}

function normalizeQuaternion(q) {
  const magnitude = Math.hypot(q.w, q.x, q.y, q.z);
  if (magnitude <= 1e-8) {
    return { w: 1, x: 0, y: 0, z: 0 };
  }
  return { w: q.w / magnitude, x: q.x / magnitude, y: q.y / magnitude, z: q.z / magnitude };
}

function quaternionDot(a, b) {
  return a.w * b.w + a.x * b.x + a.y * b.y + a.z * b.z;
}

function quaternionFromAxisAngle(x, y, z, degrees) {
  const halfRadians = degrees * Math.PI / 360;
  const sinHalf = Math.sin(halfRadians);
  return normalizeQuaternion({ w: Math.cos(halfRadians), x: x * sinHalf, y: y * sinHalf, z: z * sinHalf });
}

function multiplyQuaternions(a, b) {
  return normalizeQuaternion({
    w: a.w * b.w - a.x * b.x - a.y * b.y - a.z * b.z,
    x: a.w * b.x + a.x * b.w + a.y * b.z - a.z * b.y,
    y: a.w * b.y - a.x * b.z + a.y * b.w + a.z * b.x,
    z: a.w * b.z + a.x * b.y - a.y * b.x + a.z * b.w,
  });
}

function quaternionFromAhrsEuler(roll, pitch, yaw) {
  const yawRotation = quaternionFromAxisAngle(0, 0, 1, yaw);
  const pitchRotation = quaternionFromAxisAngle(0, 1, 0, -pitch);
  const rollRotation = quaternionFromAxisAngle(1, 0, 0, -roll);
  return multiplyQuaternions(yawRotation, multiplyQuaternions(pitchRotation, rollRotation));
}

function slerpQuaternion(from, to, t) {
  let end = normalizeQuaternion(to);
  let dot = quaternionDot(from, end);
  if (dot < 0) {
    end = { w: -end.w, x: -end.x, y: -end.y, z: -end.z };
    dot = -dot;
  }
  if (dot > 0.9995) {
    return normalizeQuaternion({
      w: from.w + (end.w - from.w) * t,
      x: from.x + (end.x - from.x) * t,
      y: from.y + (end.y - from.y) * t,
      z: from.z + (end.z - from.z) * t,
    });
  }
  const theta0 = Math.acos(clamp(dot, -1, 1));
  const sinTheta0 = Math.sin(theta0);
  const theta = theta0 * t;
  const sinTheta = Math.sin(theta);
  const scaleFrom = Math.cos(theta) - dot * sinTheta / sinTheta0;
  const scaleTo = sinTheta / sinTheta0;
  return {
    w: from.w * scaleFrom + end.w * scaleTo,
    x: from.x * scaleFrom + end.x * scaleTo,
    y: from.y * scaleFrom + end.y * scaleTo,
    z: from.z * scaleFrom + end.z * scaleTo,
  };
}

function quaternionToAxisAngle(q) {
  const normalized = normalizeQuaternion(q);
  const angleRadians = 2 * Math.acos(clamp(normalized.w, -1, 1));
  const sinHalf = Math.sqrt(Math.max(0, 1 - normalized.w * normalized.w));
  if (sinHalf < 1e-5) {
    return { x: 0, y: 0, z: 1, degrees: 0 };
  }
  return {
    x: normalized.x / sinHalf,
    y: normalized.y / sinHalf,
    z: normalized.z / sinHalf,
    degrees: angleRadians * 180 / Math.PI,
  };
}

function updateDroneTransform() {
  // The drone graphic is drawn nose-right so body +X maps to CSS +X and body +Y maps to CSS +Y.
  // AHRS Euler input is converted to a quaternion using the same browser-side mapping as
  // rotateZ(yaw) -> rotateY(-pitch) -> rotateX(-roll), then smoothed with quaternion slerp.
  const rotation = quaternionToAxisAngle(renderedOrientation);
  drone.style.transform =
    `rotate3d(${rotation.x}, ${rotation.y}, ${rotation.z}, ${rotation.degrees}deg)`;
}

function scheduleDroneAnimation() {
  if (!droneAnimationFrame) {
    droneAnimationFrame = requestAnimationFrame(animateDrone);
  }
}

function animateDrone() {
  droneAnimationFrame = 0;
  setQuaternion(renderedOrientation, slerpQuaternion(renderedOrientation, targetOrientation, 0.22));
  const isSettled = 1 - Math.abs(quaternionDot(renderedOrientation, targetOrientation)) < 1e-5;
  if (isSettled) {
    setQuaternion(renderedOrientation, targetOrientation);
  }
  updateDroneTransform();
  if (!isSettled) {
    scheduleDroneAnimation();
  }
}

function drawAltitudeGraph() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (altHistory.length < 2) return;

  const minAlt = Math.min(...altHistory);
  const maxAlt = Math.max(...altHistory);
  const range = Math.max(0.5, maxAlt - minAlt);

  ctx.strokeStyle = '#4af';
  ctx.beginPath();
  for (let i = 0; i < altHistory.length; i++) {
    const x = (i / (altHistory.length - 1)) * canvas.width;
    const y = canvas.height - ((altHistory[i] - minAlt) / range) * canvas.height;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();
}

function updateUI(packet) {
  telemetryText.textContent = JSON.stringify(packet, null, 2);

  if (packet.type === 'ahrs') {
    const d = packet.data;
    const roll = Number(d.roll);
    const pitch = Number(d.pitch);
    const yaw = Number(d.yaw);
    const heading = Number(d.heading);
    if (Number.isFinite(roll) && Number.isFinite(pitch) && Number.isFinite(yaw)) {
      const nextOrientation = quaternionFromAhrsEuler(roll, pitch, yaw);
      if (!hasAhrsPacket) {
        hasAhrsPacket = true;
        setQuaternion(renderedOrientation, nextOrientation);
        setQuaternion(targetOrientation, nextOrientation);
        updateDroneTransform();
        attitudeStateEl.textContent = 'Receiving AHRS updates';
      } else {
        setQuaternion(targetOrientation, nextOrientation);
        if (1 - Math.abs(quaternionDot(renderedOrientation, targetOrientation)) < 1e-5) {
          setQuaternion(renderedOrientation, targetOrientation);
          updateDroneTransform();
        } else {
          scheduleDroneAnimation();
        }
      }
    }
    if (Number.isFinite(heading)) {
      needle.style.transform = `rotate(${heading}deg)`;
      headingEl.textContent = heading.toFixed(1);
    }
  }

  if (packet.type === 'sensor') {
    const d = packet.data;
    const altitude = Number(d.baro.altitudeM);
    if (Number.isFinite(altitude)) {
      altitudeEl.textContent = altitude.toFixed(2);
      altHistory.push(altitude);
      if (altHistory.length > 240) altHistory.shift();
      drawAltitudeGraph();
    }

  }

  if (packet.type === 'status') {
    deviceStatusEl.textContent = `Device: ${packet.data.level}: ${packet.data.message}`;
    if (typeof packet.data.lowPowerIdle === 'boolean') {
      setIdleUi(packet.data.lowPowerIdle);
    }
  }
}

async function connect() {
  if (!('serial' in navigator)) {
    alert('WebSerial is not supported in this browser.');
    return;
  }

  try {
    port = await navigator.serial.requestPort();
    await port.open({ baudRate: 115200 });
    writer = port.writable.getWriter();
    decoder = new TextDecoderStream();
    pipeAbortController = new AbortController();
    pipePromise = port.readable
      .pipeTo(decoder.writable, { signal: pipeAbortController.signal })
      .catch(() => {});
    reader = decoder.readable.getReader();
    keepReading = true;
    statusEl.textContent = 'Connected';
    document.getElementById('connectBtn').disabled = true;
    document.getElementById('disconnectBtn').disabled = false;
  } catch (error) {
    keepReading = false;
    try { if (reader) reader.releaseLock(); } catch (_) {}
    try { if (writer) writer.releaseLock(); } catch (_) {}
    try { if (port) await port.close(); } catch (_) {}
    reader = undefined;
    writer = undefined;
    port = undefined;
    resetSessionUi();
    decoder = undefined;
    pipeAbortController = undefined;
    pipePromise = undefined;
    throw error;
  }

  let buffer = '';
  try {
    while (keepReading) {
      const { value, done } = await reader.read();
      if (done) break;
      if (!value) break;
      buffer += value;

      let nl;
      while ((nl = buffer.indexOf('\n')) >= 0) {
        const line = buffer.slice(0, nl).trim();
        buffer = buffer.slice(nl + 1);
        if (!line) continue;
        try {
          const packet = JSON.parse(line);
          updateUI(packet);
        } catch (_) {
          parseErrors += 1;
          deviceStatusEl.textContent = `Device: telemetry parse errors=${parseErrors}`;
        }
      }
    }
  } finally {
    if (port) {
      await disconnect(true);
    }
  }
}

async function disconnect(skipPipeAwait = false) {
  keepReading = false;
  try { if (reader) await reader.cancel(); } catch (_) {}
  try { if (reader) reader.releaseLock(); } catch (_) {}
  try { if (pipeAbortController) pipeAbortController.abort(); } catch (_) {}
  if (!skipPipeAwait) {
    try { if (pipePromise) await pipePromise; } catch (_) {}
  }
  try { if (writer) writer.releaseLock(); } catch (_) {}
  try { if (port) await port.close(); } catch (_) {}
  reader = undefined;
  writer = undefined;
  port = undefined;
  decoder = undefined;
  pipeAbortController = undefined;
  pipePromise = undefined;
  statusEl.textContent = 'Disconnected';
  resetSessionUi();
  document.getElementById('connectBtn').disabled = false;
  document.getElementById('disconnectBtn').disabled = true;
}

async function toggleIdle() {
  if (!writer) return;
  const cmd = idleState ? 'IDLE:0\n' : 'IDLE:1\n';
  await writer.write(new TextEncoder().encode(cmd));
}

document.getElementById('connectBtn').addEventListener('click', () => connect().catch(err => {
  statusEl.textContent = `Connect error: ${err.message}`;
  resetSessionUi();
}));
document.getElementById('disconnectBtn').addEventListener('click', () => disconnect().catch(err => {
  statusEl.textContent = `Disconnect error: ${err.message}`;
}));
idleBtn.addEventListener('click', () => toggleIdle().catch(err => {
  statusEl.textContent = `Idle command error: ${err.message}`;
}));
resetSessionUi();
</script>
</body>
</html>
